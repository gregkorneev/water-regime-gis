services:
  water-regime-gis:
    build: .
    platform: linux/amd64
    ports:
      - "8765:8765"
    environment:
      WATER_REGIME_GIS_RUNTIME: docker
      WATER_REGIME_GIS_HOST: 0.0.0.0
      WATER_REGIME_GIS_PORT: 8765
      WATER_REGIME_GIS_NO_BROWSER: "1"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./configs:/app/configs:ro
