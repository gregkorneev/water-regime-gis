name: Build Windows desktop shell

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish WebView2 desktop shell
        shell: pwsh
        run: >
          dotnet publish packaging/windows/WaterRegimeGIS.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/windows-shell

      - name: Check executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/windows-shell/Water Regime GIS.exe")) {
            throw "Windows desktop executable was not created."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Water-Regime-GIS-Windows-Shell
          path: dist/windows-shell/Water Regime GIS.exe

  build-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows desktop shell
        shell: pwsh
        run: >
          dotnet publish packaging/windows/WaterRegimeGIS.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o dist/water-regime-gis-windows-release

      - name: Assemble release folders
        shell: pwsh
        run: |
          $release = "dist/water-regime-gis-windows-release"
          New-Item -ItemType Directory -Force `
            "$release/configs", "$release/data/aoi", "$release/data/raw", "$release/data/interim", "$release/data/processed", `
            "$release/outputs/maps", "$release/outputs/reports", "$release/outputs/rasters", "$release/scripts" | Out-Null
          Copy-Item configs/project.example.json "$release/configs/project.example.json"
          Copy-Item pyproject.toml "$release/pyproject.toml"
          Copy-Item LICENSE "$release/LICENSE"
          Copy-Item THIRD_PARTY_NOTICES.md "$release/THIRD_PARTY_NOTICES.md"
          Copy-Item -Recurse src "$release/src"
          New-Item -ItemType Directory -Force "$release/docs" | Out-Null
          Copy-Item -Recurse docs/wiki "$release/docs/wiki"
          Copy-Item scripts/run_app.py, scripts/check_project.py, scripts/check_satellite_pipeline.py, scripts/install_nspd_plugin.py "$release/scripts/"
          Copy-Item -Recurse scripts/qgis "$release/scripts/qgis"
          Copy-Item -Recurse packaging/windows "$release/windows-shell"
          @(
            "Water Regime GIS для Windows",
            "",
            "Требование: установленный чистый QGIS с официального сайта или OSGeo4W.",
            "",
            "1. Откройте Water Regime GIS.exe.",
            "2. Приложение само найдет QGIS, запустит локальный backend и откроет интерфейс внутри окна приложения.",
            "",
            "QGIS не открывается пользователем и используется как скрытый геодвижок.",
            "Python, GDAL, плагины QGIS и рабочие папки готовятся автоматикой приложения.",
            "Пользовательские данные хранятся в папках data, outputs и configs рядом с exe."
          ) | Set-Content -Encoding UTF8 "$release/README_RU.txt"

      - name: Check release package
        shell: pwsh
        run: |
          if (!(Test-Path "dist/water-regime-gis-windows-release/Water Regime GIS.exe")) { throw "Missing exe." }
          if (!(Test-Path "dist/water-regime-gis-windows-release/src/water_regime_gis/webapp.py")) { throw "Missing backend." }
          if (!(Test-Path "dist/water-regime-gis-windows-release/scripts/qgis/process_satellite_indices.py")) { throw "Missing QGIS scripts." }
          if (Test-Path "dist/water-regime-gis-windows-release/water-regime-gis-image.tar") { throw "Docker image tar must not be required in QGIS-first Windows release." }

      - uses: actions/upload-artifact@v4
        with:
          name: Water-Regime-GIS-Windows-Release
          path: dist/water-regime-gis-windows-release
